# Read-only checks for pull requests targeting main.
#
# This workflow never uses pull_request_target, never asks for write permissions
# and needs no secrets: `claude plugin test` runs on the mock engine (no model
# calls) and `claude plugin validate` reads the manifests locally. Both were
# verified locally with an empty HOME (847/847 tests passed), so a runner may
# install the CLI and run them without logging in.
#
# Making these checks required is a repository setting; this file only defines
# the checks and does not change branch protection.
name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only on purpose: no PR code ever receives a write token.
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Pinned CLI compatibility points, defined once and reused by the test matrix.
  # The minimum is the lowest supported host; the current version is the one
  # verified locally (847 tests passing).
  CLI_MINIMUM: &cli-minimum '2.1.292'
  CLI_CURRENT: &cli-current '2.1.304'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check the version in all three files
        run: npm run check:version

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tracked files for generated declarations
        run: npm run check:package

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Claude Code CLI ${{ env.CLI_CURRENT }}
        run: npm install -g "@anthropic-ai/claude-code@${{ env.CLI_CURRENT }}"
      - name: Validate the marketplace, manifest and hooks
        run: npm run validate

  test:
    name: test (cli ${{ matrix.cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli:
          - *cli-minimum
          - *cli-current
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Claude Code CLI ${{ matrix.cli }}
        run: npm install -g "@anthropic-ai/claude-code@${{ matrix.cli }}"
      - name: Run the mock-engine tests
        run: npm test

  test-latest:
    name: test (cli latest)
    # Exploratory: a CLI release newer than the verified version may change the
    # Mod contract. Keep it visible without blocking a PR on an untested release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the latest Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Run the mock-engine tests on the latest CLI
        run: npm test
      - name: Mark the run as exploratory
        if: always()
        run: |
          {
            echo '## Latest-CLI test is exploratory'
            echo ''
            echo 'This job tracks the newest published Claude Code CLI and is not a required check.'
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck (not run)
    runs-on: ubuntu-latest
    steps:
      - name: Record that typecheck is not run
        run: |
          {
            echo '## Typecheck not run'
            echo ''
            echo '`npm run typecheck` is not run in PR CI: it needs the CLI-generated'
            echo 'declarations in `.claude-plugin/types/`, and generating them requires a'
            echo 'real model call (see `scripts/check-types.mjs`). PR CI never makes model'
            echo 'calls or uses credentials, so this job records the omission instead of'
            echo 'claiming a passing typecheck.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning title=Typecheck not run::Generated CLI declarations require a real model call; see scripts/check-types.mjs.'
